name: CI

on:
  pull_request:
    branches: [ main, master ]

jobs:

  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Task
        uses: arduino/setup-task@v1

      - name: Format
        run: task format

      - name: Lint
        run: task lint


  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./cmd/api


  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test -v ./...


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose
        run: docker compose -f docker-compose-test.yml up --abort-on-container-exit